[program:rag-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/RAG_CHATBOT
command=/usr/bin/php artisan queue:work rag --queue=rag --sleep=3 --tries=3 --timeout=300 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/RAG_CHATBOT/storage/logs/rag-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=360
