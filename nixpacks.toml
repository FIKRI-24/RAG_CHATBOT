# Nixpacks Configuration for TKJ AI Assistant (RAG Chatbot) on Railway
providers = ["php", "node"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_EXTENSIONS = "pdo_pgsql,pgsql,gd,zip,mbstring,bcmath,intl"

[phases.setup]
nixPkgs = [
    '...',
    'php82',
    'php82Extensions.pdo_pgsql',
    'php82Extensions.pgsql',
    'php82Extensions.gd',
    'php82Extensions.mbstring',
    'php82Extensions.bcmath',
    'php82Extensions.zip',
    'php82Extensions.intl',
    'php82Packages.composer',
    'nodejs_22'
]

[phases.install]
cmds = [
    'npm ci',
    'composer install --no-dev --optimize-autoloader --no-interaction'
]

[phases.build]
cmds = [
    'npm run build',
    'php artisan storage:link'
]

# Use the PHP provider's Nginx/PHP-FPM start command.
# Run migrations explicitly as a release task and run RAG in a separate worker service:
# php artisan queue:work rag --queue=rag --sleep=3 --tries=3 --timeout=300
